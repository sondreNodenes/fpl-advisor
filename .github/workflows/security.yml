name: Security

# Secrets, dependency CVEs, bandit rules, container image and IaC scans (security/scan.sh).
# Reports are uploaded as an artifact on every run, including failures.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday 05:17 UTC: new CVEs appear without code changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Scan (fails on secrets, CVEs, bandit findings, fixable HIGH/CRITICAL image
          CVEs, unaccepted IaC findings, or failing abuse tests)
        run: security/scan.sh security/latest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-reports
          path: security/latest
          retention-days: 30
