<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPL Advisor</title>
<style>
  :root {
    color-scheme: light;
    --page: #f4f4f1; --surface: #fcfcfb; --surface-2: #f0efec; --text: #0b0b0b;
    --text-2: #52514e; --muted: #898781; --line: #e1e0d9; --ring: rgba(11,11,11,.10);
    --accent: #37003c; --accent-ink: #ffffff;
    --in: #2a78d6; --out: #c3c2b7;
    --good: #0ca30c; --good-text: #006300; --critical: #d03b3b; --warning: #fab219;
    --pitch: #e6f2e6; --pitch-line: #c7e0c7;
    --seq-0: #f0efec; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf;
    --fdr-1: #0b7a3b; --fdr-2: #0ca30c; --fdr-3: #e1e0d9; --fdr-4: #ec835a; --fdr-5: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --text: #f0efec;
      --text-2: #c3c2b7; --muted: #898781; --line: #2c2c2a; --ring: rgba(255,255,255,.10);
      --accent: #e9c7ff; --accent-ink: #1a1a19;
      --in: #3987e5; --out: #55544f;
      --good-text: #0ca30c; --pitch: #16241a; --pitch-line: #23382a;
      --seq-0: #232321; --seq-1: #0d366b; --seq-2: #104281; --seq-3: #1c5cab; --seq-4: #2a78d6; --seq-5: #5598e7;
      --fdr-3: #383835;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --text: #f0efec;
    --text-2: #c3c2b7; --muted: #898781; --line: #2c2c2a; --ring: rgba(255,255,255,.10);
    --accent: #e9c7ff; --accent-ink: #1a1a19;
    --in: #3987e5; --out: #55544f;
    --good-text: #0ca30c; --pitch: #16241a; --pitch-line: #23382a;
    --seq-0: #232321; --seq-1: #0d366b; --seq-2: #104281; --seq-3: #1c5cab; --seq-4: #2a78d6; --seq-5: #5598e7;
    --fdr-3: #383835;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--accent); color: var(--accent-ink); }
  .bar { max-width: 1280px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 16px;
         align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: -.01em; margin-right: auto; }
  .brand small { font-weight: 400; opacity: .75; font-size: 13px; margin-left: 8px; }
  form { display: flex; gap: 8px; flex: 1 1 280px; max-width: 560px; min-width: 0; }
  input { flex: 1; min-width: 0; padding: 9px 12px; font: inherit; color: var(--text);
          background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; }
  button { padding: 9px 16px; font: inherit; font-weight: 600; border: 1px solid var(--ring);
           border-radius: 8px; background: var(--surface); color: var(--text); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px 16px 64px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px;
          padding: 16px; min-width: 0; }
  .span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; }
  .span-6 { grid-column: span 6; }
  @media (max-width: 960px) { .span-8, .span-4, .span-6 { grid-column: span 12; } }
  h2 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--text-2); font-size: 13px; margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); min-width: 0; }
  @media (max-width: 420px) { .kpis { grid-template-columns: 1fr 1fr; } .shirt { width: 78px; font-size: 11px; } .kpi strong { font-size: 18px; } }
  .kpi { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 12px 14px; }
  .kpi span { display: block; color: var(--text-2); font-size: 12px; }
  .kpi strong { display: block; font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .kpi em { font-style: normal; font-size: 12px; color: var(--muted); }
  .delta { color: var(--good-text); font-weight: 600; }
  .headline { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .swap { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 12px; }
  .swap-top { display: flex; min-width: 0; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill { display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 10px; border-radius: 999px;
          background: var(--surface-2); font-weight: 600; }
  .pill small { font-weight: 400; color: var(--text-2); }
  .arrow { color: var(--muted); }
  .gainbadge { margin-left: auto; font-weight: 700; color: var(--good-text); font-variant-numeric: tabular-nums; }
  .compare { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center;
             font-size: 12px; margin: 6px 0 10px; }
  .compare .gw { color: var(--text-2); white-space: nowrap; }
  .bars { display: grid; gap: 2px; }
  .barrow { display: flex; align-items: center; gap: 6px; }
  .barrow i { display: block; height: 10px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .barrow .b-in { background: var(--in); } .barrow .b-out { background: var(--out); }
  .barrow b { font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  ul.why { margin: 0; padding-left: 18px; color: var(--text-2); }
  ul.why li { margin: 2px 0; }
  details { margin-top: 12px; }
  details summary { cursor: pointer; color: var(--text-2); }
  .alt { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: baseline; }
  .alt:first-of-type { border-top: 0; }
  .alt .num { margin-left: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; }
  .scroll { overflow-x: auto; }
  .cap-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; margin: 6px 0; }
  .cap-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap-row i { display: block; height: 14px; background: var(--in); border-radius: 0 4px 4px 0; }
  .cap-row .track { display: flex; align-items: center; gap: 6px; }
  .cap-row b { font-weight: 500; color: var(--text-2); font-size: 12px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
         background: var(--surface-2); color: var(--text-2); margin-left: 4px; vertical-align: 1px; }
  .chip { border-top: 1px solid var(--line); padding: 10px 0; }
  .chip:first-of-type { border-top: 0; padding-top: 0; }
  .chip-head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .verdict { margin-left: auto; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .v-play { background: var(--good); color: #fff; }
  .v-save { background: var(--surface-2); color: var(--text); }
  .v-unavailable { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .chip p { margin: 4px 0 0; color: var(--text-2); font-size: 13px; }
  .chip .vals { font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .pitch { background: var(--pitch); border-radius: 10px; padding: 14px 8px;
           background-image: linear-gradient(var(--pitch-line) 1px, transparent 1px);
           background-size: 100% 25%; }
  .line { display: flex; justify-content: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .shirt { width: 104px; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px;
           padding: 6px; text-align: center; font-size: 12px; position: relative; }
  .shirt .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shirt .p { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .shirt .badge { position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%;
                  background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700;
                  display: grid; place-items: center; }
  .shirt.new { box-shadow: 0 0 0 2px var(--in); }
  .bench { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .fdr { display: inline-block; min-width: 18px; padding: 0 4px; border-radius: 4px; font-size: 11px; font-weight: 700;
         text-align: center; color: #fff; }
  .fdr-1 { background: var(--fdr-1); } .fdr-2 { background: var(--fdr-2); } .fdr-3 { background: var(--fdr-3); color: var(--text); }
  .fdr-4 { background: var(--fdr-4); color: #0b0b0b; } .fdr-5 { background: var(--fdr-5); }
  td.heat { text-align: center; min-width: 58px; padding: 4px 6px; }
  td.heat .p { font-weight: 600; }
  td.heat .o { font-size: 11px; display: block; }
  .h0 { background: var(--seq-0); } .h1 { background: var(--seq-1); } .h2 { background: var(--seq-2); }
  .h3 { background: var(--seq-3); color: #fff; } .h4 { background: var(--seq-4); color: #fff; } .h5 { background: var(--seq-5); color: #fff; }
  .h3 .o, .h4 .o, .h5 .o { color: #fff; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabs button { padding: 5px 10px; font-size: 13px; font-weight: 500; }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .toolbar { display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; align-items: center; }
  .error { color: var(--critical); font-weight: 600; }
  .notes { color: var(--text-2); font-size: 12px; padding-left: 18px; margin: 0; }
  .empty { text-align: center; padding: 40px 16px; color: var(--text-2); }
  .empty strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
  .flag { color: var(--critical); font-weight: 700; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">FPL Advisor<small id="gwlabel"></small></div>
    <form id="form">
      <input id="team" aria-label="FPL team ID or URL" placeholder="Team ID or URL, e.g. 5767275" required>
      <button id="go" type="submit">Get advice</button>
    </form>
  </div>
</header>
<main>
  <div id="out">
    <div class="card empty"><strong>Paste your FPL team ID or URL</strong>
      Transfers planned over the next 3 gameweeks, reasons for every swap, captain, best XI and chip timing.</div>
  </div>
  <div class="grid" style="margin-top:16px">
    <section class="card span-12">
      <div class="toolbar">
        <div><h2>Top predicted players</h2><p class="sub" id="topsub">Expected points, already scaled by chance of playing.</p></div>
        <div class="tabs" id="sorttabs">
          <button type="button" data-sort="next" aria-pressed="true">Next GW</button>
          <button type="button" data-sort="horizon" aria-pressed="false">Next 3 GWs</button>
        </div>
      </div>
      <div class="tabs" id="postabs">
        <button type="button" data-pos="" aria-pressed="true">All</button>
        <button type="button" data-pos="GK" aria-pressed="false">GK</button>
        <button type="button" data-pos="DEF" aria-pressed="false">DEF</button>
        <button type="button" data-pos="MID" aria-pressed="false">MID</button>
        <button type="button" data-pos="FWD" aria-pressed="false">FWD</button>
      </div>
      <div id="top" class="scroll">Loading…</div>
    </section>
  </div>
</main>
<script>
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (x, d = 1) => Number(x).toFixed(d);
const signed = (x, d = 1) => (x > 0 ? "+" : "") + fmt(x, d);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

const fdr = (f) => `<span class="fdr fdr-${f.difficulty ?? 3}" title="FPL difficulty ${f.difficulty ?? "?"}">${esc(f.opponent)} ${f.home ? "H" : "A"}</span>`;
const fixtures = (opps) => opps && opps.length ? opps.map(fdr).join(" ") : `<span class="muted">blank</span>`;
const heatClass = (p) => "h" + Math.min(5, Math.max(0, Math.floor(p) - 1));  // <2, 2-3, ..., 6+
const flag = (p) => p.availability < 1 ? ` <span class="flag" title="${esc(p.news)}">${Math.round(p.availability * 100)}%</span>` : "";

function kpis(a, best, base) {
  const horizon = best.lineups.reduce((s, l) => s + l.points, 0) - best.hit_cost;
  const baseHorizon = base ? base.lineups.reduce((s, l) => s + l.points, 0) : horizon;
  const span = a.gameweeks.length > 1 ? `GW${a.gameweeks[0]}–${a.gameweeks.at(-1)}` : `GW${a.gameweek}`;
  const tile = (label, value, note = "") => `<div class="kpi"><span>${label}</span><strong>${value}</strong><em>${note}</em></div>`;
  return `<div class="kpis span-12">
    ${tile(esc(a.team_name), esc(a.manager), `squad after GW${a.picks_gameweek}`)}
    ${tile(`Expected pts GW${a.gameweek}`, fmt(best.lineups[0].points - best.hit_cost), base ? `<span class="delta">${signed(best.first_gain)}</span> vs no transfers` : "")}
    ${tile(`Expected pts ${span}`, fmt(horizon), base ? `<span class="delta">${signed(horizon - baseHorizon)}</span> vs no transfers` : "")}
    ${tile("Captain", esc(best.captain.name), `vice ${esc(best.vice_captain.name)}`)}
    ${tile("Bank", `£${fmt(a.bank)}m`, best.n_transfers ? `£${fmt(best.bank_after)}m after transfers` : "")}
    ${tile("Free transfers", a.free_transfers, "estimated from history")}
  </div>`;
}

function swapCard(t) {
  const max = Math.max(...t.in.horizon.map((h) => h.points), ...t.out.horizon.map((h) => h.points), 1);
  const rows = t.in.horizon.map((h, i) => {
    const o = t.out.horizon[i];
    return `<div class="gw">GW${h.gameweek}</div><div class="bars">
      <div class="barrow" title="${esc(t.in.name)}: ${fmt(h.points, 2)} pts"><i class="b-in" style="width:${h.points / max * 70}%"></i><b>${fmt(h.points)}</b> ${fixtures(h.opponents)}</div>
      <div class="barrow" title="${esc(t.out.name)}: ${fmt(o.points, 2)} pts"><i class="b-out" style="width:${o.points / max * 70}%"></i><b>${fmt(o.points)}</b> ${fixtures(o.opponents)}</div></div>`;
  }).join("");
  return `<div class="swap">
    <div class="swap-top">
      <span class="pill">${esc(t.out.name)}<small>${esc(t.out.team)} · £${fmt(t.out.price)}m</small></span>${flag(t.out)}
      <span class="arrow">→</span>
      <span class="pill">${esc(t.in.name)}<small>${esc(t.in.team)} · £${fmt(t.in.price)}m</small></span>
      <span class="gainbadge" title="Player-for-player difference over the horizon">${signed(t.points_gain)} pts</span>
    </div>
    <div class="legend"><span><i style="background:var(--in)"></i>${esc(t.in.name)} (in)</span><span><i style="background:var(--out)"></i>${esc(t.out.name)} (out)</span></div>
    <div class="compare">${rows}</div>
    <ul class="why">${t.why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>
  </div>`;
}

function transfersCard(a) {
  const best = a.recommendations[0];
  const body = best.n_transfers ? best.transfers.map(swapCard).join("") :
    `<p class="sub">Your current squad is the best use of your transfers right now. ${esc(best.reason)}.</p>`;
  const alts = a.recommendations.slice(1).map((r) => `<div class="alt">
      <span>${r.n_transfers ? r.transfers.map((t) => `${esc(t.out.name)} → ${esc(t.in.name)}`).join(", ") : "No transfers"}</span>
      <span class="muted">${esc(r.reason)}</span></div>`).join("");
  const altDetails = a.recommendations.slice(1).filter((r) => r.n_transfers).map((r) =>
    `<p class="sub" style="margin-top:12px">Option ${r.rank}: ${esc(r.reason)}</p>${r.transfers.map(swapCard).join("")}`).join("");
  return `<section class="card span-8">
    <h2>Transfer plan</h2><p class="sub">Best moves now, judged on GW${a.gameweeks[0]}–${a.gameweeks.at(-1)} with your free transfers and the −4 hit.</p>
    <p class="headline">${best.n_transfers ? best.transfers.map((t) => `${esc(t.out.name)} → ${esc(t.in.name)}`).join(", ") : "Hold"}: <span style="font-weight:400">${esc(best.reason)}</span></p>
    ${body}
    <details><summary>Other options</summary>${alts}${altDetails}</details>
  </section>`;
}

function captainCard(best, a) {
  const opts = [...best.starting].sort((x, y) => y.predicted_points - x.predicted_points).slice(0, 5);
  const max = opts[0]?.predicted_points || 1;
  const rows = opts.map((p) => `<div class="cap-row" title="${esc(p.name)}: ${fmt(p.predicted_points, 2)} expected points">
    <span class="name">${esc(p.name)}${p.id === best.captain.id ? '<span class="tag">C</span>' : p.id === best.vice_captain.id ? '<span class="tag">V</span>' : ""}</span>
    <span class="track"><i style="width:${p.predicted_points / max * 75}%"></i><b>${fmt(p.predicted_points)}</b></span></div>`).join("");
  const weekly = best.lineups.map((l) => `GW${l.gameweek}: ${esc(l.captain)}`).join(" · ");
  return `<section class="card span-4"><h2>Captaincy GW${a.gameweek}</h2>
    <p class="sub">Expected points among your starters (a captain scores double).</p>${rows}
    <p class="sub" style="margin:10px 0 0">Planned captains: ${weekly}</p></section>`;
}

function chipsCard(a) {
  if (!a.chips.length) return "";
  const rows = a.chips.map((c) => {
    const vals = c.values.length ? c.values.map((v) => `GW${v.gameweek} +${fmt(v.value)}`).join(" · ") + ` · play from +${fmt(c.threshold, 0)}` : "";
    const label = {play: "Play now", save: "Save", unavailable: "Used"}[c.verdict] || c.verdict;
    return `<div class="chip"><div class="chip-head">${esc(c.name)}<span class="verdict v-${c.verdict}">${label}</span></div>
      <p>${esc(c.detail)}</p>${vals ? `<div class="vals">${vals}</div>` : ""}</div>`;
  }).join("");
  return `<section class="card span-4"><h2>Chips</h2>
    <p class="sub">Extra expected points each chip would add, per gameweek.</p>${rows}</section>`;
}

function shirt(p, best, newIds) {
  const badge = p.id === best.captain.id ? "C" : p.id === best.vice_captain.id ? "V" : "";
  return `<div class="shirt${newIds.has(p.id) ? " new" : ""}" title="${esc(p.name)} · ${esc(p.team)} · £${fmt(p.price)}m${p.news ? " · " + esc(p.news) : ""}">
    ${badge ? `<span class="badge">${badge}</span>` : ""}
    <div class="n">${esc(p.name)}${flag(p)}</div><div class="p">${fmt(p.predicted_points)}</div>
    <div>${fixtures(p.opponents)}</div></div>`;
}

function pitchCard(a, best) {
  const newIds = new Set(best.transfers.map((t) => t.in.id));
  const lines = ["GK", "DEF", "MID", "FWD"].map((pos) =>
    `<div class="line">${best.starting.filter((p) => p.position === pos).map((p) => shirt(p, best, newIds)).join("")}</div>`).join("");
  return `<section class="card span-6"><h2>Best XI GW${a.gameweek}</h2>
    <p class="sub">After the recommended transfers; new signings outlined. Number = expected points.</p>
    <div class="pitch">${lines}</div>
    <div class="bench"><div class="sub" style="margin:0 0 4px">Bench, in order</div>
      <div class="line">${best.bench.map((p) => shirt(p, best, newIds)).join("")}</div></div></section>`;
}

function plannerCard(a, best) {
  const squad = [...best.starting, ...best.bench];
  const order = {GK: 0, DEF: 1, MID: 2, FWD: 3};
  squad.sort((x, y) => order[x.position] - order[y.position] || y.horizon_points - x.horizon_points);
  const newIds = new Set(best.transfers.map((t) => t.in.id));
  const head = a.gameweeks.map((g) => `<th class="num" style="text-align:center">GW${g}</th>`).join("");
  const rows = squad.map((p) => `<tr><td>${esc(p.name)}${newIds.has(p.id) ? '<span class="tag">NEW</span>' : ""}${flag(p)}</td><td class="muted">${p.position}</td>
    ${p.horizon.map((h) => `<td class="heat ${heatClass(h.points)}" title="${esc(p.name)} GW${h.gameweek}: ${fmt(h.points, 2)} pts"><span class="p">${fmt(h.points)}</span><span class="o">${h.opponents.length ? h.opponents.map((o) => `${esc(o.opponent)} ${o.home ? "H" : "A"}`).join(", ") : "blank"}</span></td>`).join("")}
    <td class="num"><strong>${fmt(p.horizon_points)}</strong></td></tr>`).join("");
  const totals = best.lineups.map((l) => `<td class="num" style="text-align:center"><strong>${fmt(l.points)}</strong><br><span class="muted">bench ${fmt(l.bench_points)}</span></td>`).join("");
  return `<section class="card span-6"><h2>Fixture planner</h2>
    <p class="sub">Expected points per gameweek for the squad after transfers. Darker = more points.</p>
    <div class="scroll"><table><thead><tr><th>Player</th><th></th>${head}<th class="num">Total</th></tr></thead>
    <tbody>${rows}<tr><td colspan="2"><strong>XI + captain</strong></td>${totals}<td></td></tr></tbody></table></div></section>`;
}

function render(a) {
  const best = a.recommendations[0];
  const base = a.recommendations.find((r) => r.n_transfers === 0);
  $("#gwlabel").textContent = `GW${a.gameweek} · data through GW${a.data_through_gameweek}`;
  $("#out").innerHTML = `<div class="grid">
    ${kpis(a, best, base)}
    ${transfersCard(a)}
    <div class="span-4" style="display:grid;gap:16px;align-content:start">${captainCard(best, a)}${chipsCard(a)}</div>
    ${pitchCard(a, best)}
    ${plannerCard(a, best)}
    <section class="card span-12"><h2>Notes</h2><ul class="notes">${a.notes.map((n) => `<li>${esc(n)}</li>`).join("")}
      <li>"Expected points" already include each player's chance of playing. FDR badges use FPL's difficulty (1 easy – 5 hard).</li></ul></section>
  </div>`;
}

const topState = {sort: "next", pos: ""};
async function loadTop() {
  try {
    const q = new URLSearchParams({limit: 30, sort: topState.sort});
    if (topState.pos) q.set("position", topState.pos);
    const r = await fetch(`/predictions?${q}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail);
    $("#topsub").textContent = `GW${d.gameweeks[0]}–${d.gameweeks.at(-1)}. Expected points, already scaled by chance of playing.`;
    const head = d.gameweeks.map((g) => `<th style="text-align:center">GW${g}</th>`).join("");
    const rows = d.players.map((p, i) => `<tr><td class="muted">${i + 1}</td><td>${esc(p.name)}${flag(p)}</td><td>${esc(p.team)}</td><td>${p.position}</td>
      <td class="num">£${fmt(p.price)}m</td><td class="num">${fmt(p.form_points)}</td>
      ${p.horizon.map((h) => `<td class="heat ${heatClass(h.points)}" title="${esc(p.name)} GW${h.gameweek}: ${fmt(h.points, 2)}"><span class="p">${fmt(h.points)}</span><span class="o">${h.opponents.map((o) => `${esc(o.opponent)} ${o.home ? "H" : "A"}`).join(", ") || "blank"}</span></td>`).join("")}
      <td class="num"><strong>${fmt(p.horizon_points)}</strong></td><td class="num muted">${p.ep_next ?? ""}</td></tr>`).join("");
    $("#top").innerHTML = `<table><thead><tr><th>#</th><th>Player</th><th>Club</th><th>Pos</th><th class="num">Price</th>
      <th class="num" title="Average points over the last 3 gameweeks">Form</th>${head}<th class="num">Total</th><th class="num" title="FPL's own ep_next">FPL ep</th></tr></thead><tbody>${rows}</tbody></table>`;
  } catch (e) { $("#top").innerHTML = `<span class="error">Could not load predictions${e.message ? ": " + esc(e.message) : ""}</span>`; }
}
for (const [id, key] of [["#sorttabs", "sort"], ["#postabs", "pos"]]) {
  $(id).addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    topState[key] = b.dataset[key];
    $(id).querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    loadTop();
  });
}

async function advise(team) {
  const btn = $("#go");
  btn.disabled = true; btn.textContent = "Working…";
  $("#out").innerHTML = `<div class="card empty">Fetching your squad and planning three gameweeks ahead…</div>`;
  try {
    const r = await fetch("/recommend", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({team})});
    const d = await r.json();
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Invalid request");
    store.set("team", team);
    history.replaceState(null, "", `?team=${encodeURIComponent(team)}`);
    render(d);
  } catch (e) {
    $("#out").innerHTML = `<div class="card error">${esc(e.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = "Get advice"; }
}
$("#form").addEventListener("submit", (ev) => { ev.preventDefault(); advise($("#team").value.trim()); });

const initial = new URLSearchParams(location.search).get("team") || store.get("team");
if (initial) { $("#team").value = initial; advise(initial); }
loadTop();
</script>
</body>
</html>
