name: Deploy

# Runs on pushes to main once the GCP repository variables are set (see README "Deploy").
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for Workload Identity Federation

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: europe-north1
  TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build image
        id: image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/fpl-advisor/app:${GITHUB_SHA::12}"
          docker build -t "$IMAGE" .
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"

      # Never push an image with a fixable HIGH or CRITICAL vulnerability.
      - name: Scan image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
            --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"

      - name: Push image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Terraform plan
        working-directory: infra/app
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          terraform init -input=false -backend-config="bucket=$PROJECT_ID-tfstate"
          terraform plan -input=false -no-color -out=tfplan \
            -var="project_id=$PROJECT_ID" -var="image=$IMAGE"

      - name: Terraform apply
        working-directory: infra/app
        run: terraform apply -input=false -no-color tfplan

      - name: Smoke test /health
        working-directory: infra/app
        run: |
          URL=$(terraform output -raw url)
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$URL/health"
          echo "Deployed: $URL"
